<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniBot – Recover Account</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
        font-family: 'Outfit', sans-serif;
        background: radial-gradient(circle at top left, rgba(108, 99, 255, 0.15), transparent),
                    radial-gradient(circle at bottom right, rgba(0, 212, 255, 0.1), transparent),
                    #0a0a0c;
        min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; margin: 0;
    }
    .recovery-card { max-width: 450px; width: 100%; border-radius: 40px; padding: 3rem; border: 1px solid var(--glass-border); text-align: center; animation: slideUp 0.6s ease; }
    .icon-box { width: 80px; height: 80px; background: var(--bot-bg); border-radius: 25px; display: inline-flex; align-items: center; justify-content: center; font-size: 2.2rem; margin-bottom: 2rem; box-shadow: var(--accent-glow); }
    h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(to right, #fff, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
    p { color: var(--text-secondary); line-height: 1.6; margin-bottom: 2rem; font-size: 0.95rem; }
  </style>
</head>
<body>
<div id="toast-container"></div>

<div class="recovery-card glass">
    <div class="icon-box"><i class="fas fa-key"></i></div>
    <h1>Account Recovery</h1>
    <p>Enter your registered details and we'll send a secure reset link to your email.</p>

    <form id="recoveryForm">
        <div class="form-group" style="text-align: left">
            <label>Register Number</label>
            <div class="input-icon-wrap">
                <i class="fas fa-id-card"></i>
                <input class="form-control" type="text" id="rn" placeholder="e.g. REG101" required>
            </div>
        </div>
        <div class="form-group" style="text-align: left; margin-top: 1.5rem">
            <label>Email Address</label>
            <div class="input-icon-wrap">
                <i class="fas fa-envelope"></i>
                <input class="form-control" type="email" id="email" placeholder="student@campus.edu" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top: 2rem; padding: 1.1rem; font-weight: 800"><i class="fas fa-paper-plane"></i> Send Recovery Link</button>
    </form>

    <div style="margin-top: 2.5rem; border-top: 1px solid var(--glass-border); padding-top: 1.5rem">
        <a href="login.html" style="color: var(--accent); text-decoration: none; font-weight: 700; font-size: 0.9rem"><i class="fas fa-arrow-left"></i> Return to Login</a>
    </div>
</div>

<script>
function showToast(msg, type='info') {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
    c.appendChild(t);
    setTimeout(() => t.remove(), 4000);
}

document.getElementById('recoveryForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    btn.disabled = true;

    // Simulation of API request
    setTimeout(() => {
        showToast('If an account exists, a recovery link has been sent.', 'success');
        btn.innerHTML = '<i class="fas fa-check"></i> Link Sent';
        setTimeout(() => window.location.href = 'login.html', 2500);
    }, 2000);
});
</script>
</body>
</html>
