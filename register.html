<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniBot – Biometric Onboarding</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; padding: 2rem; }
    .onboarding-card { width: 100%; max-width: 900px; background: white; border-radius: 40px; padding: 4rem; box-shadow: var(--shadow-md); display: flex; gap: 4rem; border: 1px solid var(--glass-border); }
    
    .form-side { flex: 1; }
    .biometric-side { width: 380px; }
    
    .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1.5rem; }
    .profile-slot { aspect-ratio: 1; border: 2px dashed #e2e8f0; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #94a3b8; text-align: center; padding: 0.5rem; }
    .profile-slot.captured { border-style: solid; border-color: #0f172a; background: #f1f5f9; color: #0f172a; }
  </style>
</head>
<body>

<div class="onboarding-card">
    <div class="form-side">
        <h1 style="font-weight: 800; color: #0f172a; font-size: 2.5rem; margin-bottom: 0.5rem;">Join UniBot</h1>
        <p style="color: #64748b; margin-bottom: 3rem;">Create your secure biometric campus profile.</p>

        <div class="form-group"><label>Full Legal Name</label><input type="text" class="form-control" placeholder="John Doe"></div>
        <div class="form-group"><label>Register Number</label><input type="text" class="form-control" placeholder="REG101"></div>
        <div class="form-group"><label>University Email</label><input type="email" class="form-control" placeholder="john@university.edu"></div>
        
        <button class="btn btn-primary btn-full" style="margin-top: 2rem; padding: 1.2rem; border-radius: 18px;" onclick="finalize()"><i class="fas fa-check-circle"></i> Finalize Registration</button>
        <div style="text-align: center; margin-top: 2rem; font-size: 0.85rem;">Already registered? <a href="login.html" style="color: #0f172a; font-weight: 700; text-decoration: none;">Login Here</a></div>
    </div>

    <div class="biometric-side">
        <div style="background: #f1f5f9; padding: 2rem; border-radius: 25px; border: 1px solid #e2e8f0;">
            <div style="font-size: 0.65rem; font-weight: 800; color: #64748b; letter-spacing: 2px; margin-bottom: 1.5rem;">BIOMETRIC SCAN (5-ANGLES)</div>
            <div style="aspect-ratio: 4/3; background: #000; border-radius: 20px; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center; color: white; position: relative; overflow: hidden;">
                <video id="v" style="width: 100%; height: 100%; object-fit: cover;"></video>
                <div id="p" style="position: absolute; text-align: center;"><i class="fas fa-camera" style="font-size: 2rem; margin-bottom: 1rem;"></i><p style="font-size: 0.7rem;">Camera Offline</p></div>
            </div>
            <button class="btn btn-secondary btn-full" style="font-size: 0.8rem; padding: 1rem;" onclick="cap()"><i class="fas fa-dot-circle"></i> CAPTURE PROFILE ANGLE</button>
            
            <div class="profile-grid">
                <div class="profile-slot captured">Front</div>
                <div class="profile-slot">Left</div>
                <div class="profile-slot">Right</div>
                <div class="profile-slot">Tilt Up</div>
                <div class="profile-slot">Tilt Down</div>
                <div class="profile-slot"><i class="fas fa-plus"></i></div>
            </div>
        </div>
    </div>
</div>

<script>
    function finalize() {
        alert("Registration Successful! Redirecting to login...");
        window.location.href = 'login.html';
    }
    function cap() { alert("Biometric Profile Captured."); }
</script>
</body>
</html>
