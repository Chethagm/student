<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniBot – Seating Intelligence</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
        :root {
            --primary: #6366f1;
            --accent-cyan: #06b6d4;
        }
        body { background: radial-gradient(circle at top left, #1e293b, #0f172a, #020617); color: white; font-family: 'Outfit', sans-serif; min-height: 100vh; margin: 0; padding: 2rem; }
        
        /* Neural CSS Emblem */
        .unibot-emblem-mini {
            width: 50px; height: 50px; background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--primary); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            position: relative; box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
            margin-bottom: 1.5rem;
        }
        .unibot-emblem-mini .core {
            width: 20px; height: 20px; background: var(--primary);
            border-radius: 50%; box-shadow: 0 0 10px var(--primary);
            animation: pulse 2s infinite;
        }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; }
    
    .seating-layout { display: flex; gap: 3rem; align-items: flex-start; }
    .hall-grid {
        flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 1rem;
        padding: 2.5rem; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
        border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .seat {
        aspect-ratio: 1; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.8rem; font-weight: 700; color: #94a3b8; transition: 0.3s;
        background: rgba(255, 255, 255, 0.01);
    }
    .seat.taken { opacity: 0.3; }
    .seat.mine { 
        background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); transform: scale(1.15); z-index: 10;
    }
    
    .info-widget { width: 340px; display: flex; flex-direction: column; gap: 1.5rem; }
    .glass-box {
        background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 30px; padding: 2rem;
    }
  </style>
</head>
<body>

<div class="header-bar">
    <div class="glass" style="max-width: 1000px; margin: 0 auto; padding: 3rem; background: rgba(255,255,255,0.03); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.05); border-radius: 40px;">
        <div class="unibot-emblem-mini">
            <div class="core"></div>
        </div>
        <a href="index.html" style="color:#94a3b8; text-decoration:none; font-size:0.8rem"><i class="fas fa-chevron-left"></i> Back to Dashboard</a>
        <h1 style="font-weight: 800; font-size: 2.5rem; margin: 1rem 0;">Seating Arrangement</h1>
        <p style="color: #94a3b8;">Automated positioning for Semester Exams</p>
    </div>
</div>

<div class="seating-layout">
    <!-- Hall Grid -->
    <div class="hall-grid">
        <!-- Generate 30 seats -->
        <div class="seat taken">1</div><div class="seat taken">2</div><div class="seat taken">3</div><div class="seat taken">4</div><div class="seat taken">5</div><div class="seat taken">6</div>
        <div class="seat taken">7</div><div class="seat taken">8</div><div class="seat taken">9</div><div class="seat mine">10</div><div class="seat taken">11</div><div class="seat taken">12</div>
        <div class="seat taken">13</div><div class="seat taken">14</div><div class="seat taken">15</div><div class="seat taken">16</div><div class="seat taken">17</div><div class="seat taken">18</div>
        <div class="seat taken">19</div><div class="seat taken">20</div><div class="seat taken">21</div><div class="seat taken">22</div><div class="seat taken">23</div><div class="seat taken">24</div>
        <div class="seat taken">25</div><div class="seat taken">26</div><div class="seat taken">27</div><div class="seat taken">28</div><div class="seat taken">29</div><div class="seat taken">30</div>
    </div>

    <!-- Info Sidebar -->
    <div class="info-widget">
        <div class="glass-box">
            <div style="font-size: 0.65rem; font-weight: 800; color: #6366f1; letter-spacing: 2px; margin-bottom: 1.5rem;">YOUR ALLOTMENT</div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display:block; font-size: 0.75rem; color: #94a3b8; font-weight: 700;">Hall Number</label>
                <div style="font-size: 1.5rem; font-weight: 800; color:#fff">LH-204</div>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display:block; font-size: 0.75rem; color: #94a3b8; font-weight: 700;">Row / Column</label>
                <div style="font-size: 1.5rem; font-weight: 800; color:#fff">Row 2 / Col 4</div>
            </div>
            <div>
                <label style="display:block; font-size: 0.75rem; color: #94a3b8; font-weight: 700;">Seat Number</label>
                <div style="font-size: 2rem; font-weight: 800; color: #fbbf24;">10 <span style="font-size:0.8rem; color:#10b981">(Confirmed)</span></div>
            </div>
        </div>

        <div class="glass-box" style="padding: 1.2rem;">
            <div style="display:flex; align-items:center; gap:1rem;">
                <div style="width:10px; height:10px; border-radius:50%; background:#10b981; box-shadow: 0 0 10px #10b981;"></div>
                <span style="font-size: 0.8rem; font-weight: 800; color: #fff;">Hall Entry Permitted</span>
            </div>
        </div>
    </div>
</div>

<script>
    console.log("Seating Module Initialized.");
</script>
</body>
</html>
