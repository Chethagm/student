<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile | UniBot</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .content-card { width: 100%; max-width: 900px; animation: fadeIn 0.8s ease; }
    
    .profile-banner { 
        background: var(--glass); border: 1px solid var(--glass-border); padding: 3rem; 
        border-radius: 40px; display: flex; align-items: center; gap: 3rem; margin-bottom: 2rem;
        position: relative; overflow: hidden;
    }
    .profile-avatar {
        width: 150px; height: 150px; border-radius: 40px; background: var(--bot-bg);
        display: flex; align-items: center; justify-content: center; font-size: 4rem;
        border: 4px solid var(--glass-border); box-shadow: var(--accent-glow); overflow: hidden;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .info-card { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 1.5rem; border-radius: 20px; }
    .info-lbl { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 2px; margin-bottom: 0.5rem; }
    .info-val { font-size: 1.1rem; font-weight: 700; }

    .face-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; margin-top: 2rem; }
    .face-item { aspect-ratio: 1; border-radius: 16px; border: 1px solid var(--glass-border); background: var(--glass); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .face-item img { width: 100%; height: 100%; object-fit: cover; }
    
    .section-header { font-size: 1.2rem; font-weight: 800; margin-top: 3rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .section-header::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
  </style>
</head>
<body>

<div class="content-card">
    <a href="index.html" class="btn btn-secondary btn-sm" style="margin-bottom: 2rem;"><i class="fas fa-chevron-left"></i> Dashboard</a>

    <div class="profile-banner">
        <div class="profile-avatar" id="avatarBox"><span id="initials">?</span></div>
        <div style="flex: 1;">
            <h1 id="userName" style="font-size: 2.5rem; font-weight: 800; margin: 0;">Loading...</h1>
            <p id="userRN" style="color: var(--text-secondary); margin-top: 0.5rem; letter-spacing: 1px;"></p>
            <div class="badge badge-present" style="margin-top: 1rem; display: inline-block;">Verified Student</div>
        </div>
        <button class="btn btn-secondary" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="section-header">Personal Information</div>
    <div class="info-grid">
        <div class="info-card"><div class="info-lbl">Full Name</div><div class="info-val" id="pName">--</div></div>
        <div class="info-card"><div class="info-lbl">Register Number</div><div class="info-val" id="pRN">--</div></div>
        <div class="info-card"><div class="info-lbl">Email Address</div><div class="info-val" id="pEmail">--</div></div>
        <div class="info-card"><div class="info-lbl">Phone Number</div><div class="info-val" id="pPhone">--</div></div>
    </div>

    <div class="section-header">Biometric Profile</div>
    <div class="face-grid" id="faceGrid">
        <!-- Dynamic Faces -->
    </div>

    <div class="section-header">Academic Bio</div>
    <div class="glass" style="padding: 2.5rem; border-radius: 30px; line-height: 1.8; color: var(--text-secondary);" id="pBio">
        No additional information provided.
    </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('unibot_user')||'null');
if(!user) window.location.href='login.html';

async function load(){
  try {
    const r=await fetch(`api/student_data.php?action=profile&uid=${user.id}`);
    const p=await r.json();
    if(!p) return;

    document.getElementById('userName').textContent = p.name;
    document.getElementById('userRN').textContent = 'REG NO: ' + p.register_number;
    document.getElementById('pName').textContent = p.name;
    document.getElementById('pRN').textContent = p.register_number;
    document.getElementById('pEmail').textContent = p.email || '--';
    document.getElementById('pPhone').textContent = p.phone_number || '--';
    document.getElementById('pBio').textContent = p.result_summary || 'No academic bio available.';
    
    if(p.face_front) document.getElementById('avatarBox').innerHTML = `<img src="${p.face_front}">`;
    else document.getElementById('initials').textContent = p.name.charAt(0).toUpperCase();

    const grid = document.getElementById('faceGrid');
    const keys = ['face_front', 'face_left', 'face_right', 'face_up', 'face_down'];
    grid.innerHTML = keys.map(k => `
        <div class="face-item">
            ${p[k] ? `<img src="${p[k]}" alt="${k}">` : `<i class="fas fa-user-slash" style="opacity:0.3"></i>`}
        </div>
    `).join('');
  } catch(e) { console.error(e); }
}

function logout(){ localStorage.removeItem('unibot_user'); window.location.href='login.html'; }
load();
</script>
</body>
</html>
